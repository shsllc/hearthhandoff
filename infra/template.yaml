AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  HearthHandoff - consent-based caregiver handoff on Ring events.
  Lambda (Function URL) + DynamoDB (TTL) + EventBridge Scheduler + Secrets Manager + SES.

Parameters:
  PublicBaseUrl:
    Type: String
    Default: ''
    Description: HTTPS base URL used in emails and cookies. The deploy script fills this with the Function URL on its second pass.
  SesFromAddress:
    Type: String
    Default: ''
    Description: Verified SES identity to send follow-up emails from. Empty disables email (in-app only).
  DemoMode:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
  CustomDomain:
    Type: String
    Default: ''
    Description: e.g. hearthhandoff.quirkworksllc.com (DNS hosted elsewhere; point a CNAME at the RegionalDomainTarget output).
  CertificateArn:
    Type: String
    Default: ''
    Description: ISSUED ACM certificate in this region for CustomDomain.
  RetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 30

Conditions:
  HasSes: !Not [!Equals [!Ref SesFromAddress, '']]
  HasDomain: !Not [!Equals [!Ref CustomDomain, '']]

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      # Data minimization: unattached door events, receipts, audit and the unclaimed-token pool expire on their own.
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      SSESpecification: { SSEEnabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  # Ring credentials are added by the owner in the Secrets Manager console after the Ring app is created.
  # APP_SECRET (session signing + token encryption key) is generated here and never leaves AWS.
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: hearthhandoff/runtime
      Description: HearthHandoff runtime secrets (Ring credentials, APP_SECRET, ACCESS_CODE)
      GenerateSecretString:
        SecretStringTemplate: '{"RING_CLIENT_ID":"","RING_CLIENT_SECRET":"","RING_HMAC_SIGNING_KEY":"","RING_ACCESS_TOKEN":"","ACCESS_CODE":""}'
        GenerateStringKey: APP_SECRET
        PasswordLength: 48
        ExcludePunctuation: true

  AppFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../dist/
      Handler: lambda.handler
      Runtime: nodejs24.x
      Architectures: [arm64]
      MemorySize: 512
      # Ring requires a webhook response within 5 s; keep the function well under that in normal operation.
      Timeout: 20
      Environment:
        Variables:
          STORE: dynamodb
          TABLE_NAME: !Ref Table
          SECRET_ID: !Ref AppSecret
          PUBLIC_BASE_URL: !Ref PublicBaseUrl
          DEMO_MODE: !Ref DemoMode
          RETENTION_DAYS: !Ref RetentionDays
          SES_FROM: !Ref SesFromAddress
          NODE_OPTIONS: --enable-source-maps
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - AWSSecretsManagerGetSecretValuePolicy: { SecretArn: !Ref AppSecret }
        - !If
          - HasSes
          - Statement:
              - Effect: Allow
                Action: ses:SendEmail
                Resource: '*'
                Condition:
                  StringEquals: { 'ses:FromAddress': !Ref SesFromAddress }
          - !Ref AWS::NoValue
      # Public HTTPS endpoint Ring calls (webhook, token exchange) and people open (UI, account link).
      FunctionUrlConfig:
        AuthType: NONE
      Events:
        Http:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
        Tick:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 minute)
            Input: '{"source":"hearthhandoff.tick"}'
            RetryPolicy: { MaximumRetryAttempts: 0 }

  # API Gateway HTTP API: the stable public entry point on the custom domain. Ring endpoints and the UI
  # sit behind it; payloads reach Lambda unmodified (the HMAC is verified on the exact body bytes).
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DisableExecuteApiEndpoint: false

  ApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasDomain
    Properties:
      DomainName: !Ref CustomDomain
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasDomain
    DependsOn: HttpApiApiGatewayDefaultStage
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomain
      Stage: $default

  AppLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AppFunction}
      RetentionInDays: 14

Outputs:
  RegionalDomainTarget:
    Condition: HasDomain
    Description: Point the custom domain's CNAME here (DNS only, not proxied).
    Value: !GetAtt ApiDomain.RegionalDomainName
  ApiEndpoint:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  FunctionUrl:
    Value: !GetAtt AppFunctionUrl.FunctionUrl
  TableName:
    Value: !Ref Table
  SecretArn:
    Value: !Ref AppSecret
  FunctionName:
    Value: !Ref AppFunction
